<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consent-Based Device Info Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
font-family:system-ui,Arial,sans-serif;background:linear-gradient(135deg,#101827,#253b63);color:#182235}
.card{background:#fff;width:min(92%,560px);padding:28px;border-radius:18px;box-shadow:0 18px 55px #0005}
h1{margin-top:0}p{line-height:1.55;color:#475569}.notice{background:#eef6ff;padding:12px;border-radius:10px}
label{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.btn{border:0;border-radius:10px;padding:12px 16px;
font-size:16px;background:#315ee7;color:white;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:14px;overflow-wrap:anywhere}
</style>
</head>
<body><main class="card">
<h1>Device Info Demo</h1>
<p>This page demonstrates a small amount of browser information collection for a local security/privacy lab.</p>
<div class="notice"><strong>What may be saved:</strong> browser-reported platform, screen size, language, timezone, and location only if you separately allow it in your browser.</div>
<label><input id="consent" type="checkbox"><span>I understand the fields above and consent to submit this demo information.</span></label>
<button class="btn" id="submit" disabled>Submit consented demo data</button>
<p id="status" role="status"></p>
<script>
const consent = document.getElementById('consent');
const submit = document.getElementById('submit');
const status = document.getElementById('status');
consent.addEventListener('change', () => submit.disabled = !consent.checked);

function optionalLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({});
    const wantsLocation = window.confirm(
      "Do you also want to share your location with this local demo? Choose Cancel to skip location."
    );
    if (!wantsLocation) return resolve({});
    navigator.geolocation.getCurrentPosition(
      p => resolve({latitude:p.coords.latitude, longitude:p.coords.longitude, accuracy:p.coords.accuracy}),
      () => resolve({}),
      {enableHighAccuracy:false, timeout:8000, maximumAge:60000}
    );
  });
}

submit.addEventListener('click', async () => {
  if (!consent.checked) return;
  submit.disabled = true;
  status.textContent = 'Submitting the fields you consented to share…';
  const data = {
    consent: true,
    platform: navigator.userAgentData?.platform || navigator.platform || 'unknown',
    screen: `${screen.width}x${screen.height}`,
    language: navigator.language || 'unknown',
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown'
  };
  Object.assign(data, await optionalLocation());
  try {
    const response = await fetch('/collect', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    });
    const result = await response.json();
    status.textContent = response.ok ? result.message : (result.error || 'Submission failed.');
  } catch (e) {
    status.textContent = 'Could not submit. Make sure the local Flask server is running.';
  } finally {
    submit.disabled = !consent.checked;
  }
});
</script>
</main></body></html>
